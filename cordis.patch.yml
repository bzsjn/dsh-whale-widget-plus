# ============================================================================
# dsh-whale-widget-plus —— DSH bundle patch
# ============================================================================
# 这是插件的"挂载声明"。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件会把鲸鱼余额挂件（plus 版）插入 profile 的配置树。
#
# 安装方式：
#   dsh plugin --profile desktop add dsh-whale-widget-plus
# 或本地开发安装：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
#
# 注意：plus 与原版 dsh-whale-widget 是同一个挂件的两个包，id 必须不同
# 才能共存于配置树；同一 profile 里只应启用其中一个。
# ============================================================================

- insert:
    - id: dsh-whale-widget-plus
      name: dsh-whale-widget-plus